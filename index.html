<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#cf6b3f">
<meta name="description" content="带橘猫互动的登录演示页 · 纯前端单页">
<title>Cat Space · 小猫登录演示</title>
<link rel="preload" as="image" href="assets/catseq20-sprite-fix.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cf6b3f'/%3E%3Cellipse cx='32' cy='38' rx='10' ry='8' fill='%23fff8ef'/%3E%3Ccircle cx='18' cy='27' r='5' fill='%23fff8ef'/%3E%3Ccircle cx='27' cy='22' r='5' fill='%23fff8ef'/%3E%3Ccircle cx='38' cy='22' r='5' fill='%23fff8ef'/%3E%3Ccircle cx='47' cy='27' r='5' fill='%23fff8ef'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2c2118; --ink-2:#5b4a3d; --muted:#8b7865;
  --paper:#f8f2e7; --card:#fffdf8; --field:#f8f1e6;
  --line:#e9dccb; --accent:#cf6b3f; --accent-dark:#b4542c;
  --serif:Georgia,"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",Arial,sans-serif;
  --fs-xs:11px; --fs-sm:12.5px; --fs-base:13.5px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:var(--fs-base)/1.55 var(--sans);color:var(--ink);background:var(--paper);
  -webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(92,60,35,.055) 1px,transparent 1px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
}
.login-page{
  position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:42px 28px 34px;overflow-x:hidden;overflow-y:auto;
  background:
    radial-gradient(1000px 720px at 16% 18%,#fffaf1 0,rgba(255,250,241,.5) 46%,transparent 72%),
    radial-gradient(760px 560px at 88% 82%,#f3e3cf 0,rgba(243,227,207,.5) 48%,transparent 70%),
    linear-gradient(140deg,#f9f3e8 0%,#f4eadc 100%);
}
.login-stage{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:34px;width:100%;max-width:820px;min-width:0}

/* ---------- 猫 ---------- */
.cat-panel{position:relative;flex:0 0 352px;width:352px;user-select:none;pointer-events:none}
.cat-halo{
  position:absolute;left:50%;top:44%;width:356px;height:356px;transform:translate(-50%,-50%);
  border-radius:50%;z-index:0;
  background:radial-gradient(circle,#ffe7c9 0,rgba(255,231,201,.55) 48%,rgba(255,231,201,0) 71%);
}
.cat-halo:after{
  content:"";position:absolute;inset:20px;border:1px dashed rgba(158,107,66,.22);border-radius:50%;
}
.cat-stage{position:relative;z-index:1;width:100%;aspect-ratio:1/1;transform-origin:50% 64%;will-change:transform;backface-visibility:hidden;filter:drop-shadow(0 22px 26px rgba(92,58,32,.2))}
.cat-fallback,.cat-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
.cat-fallback{transition:opacity .2s ease}
.cat-canvas{pointer-events:none}
.cat-bubble{
  position:absolute;z-index:2;left:50%;top:-6px;transform:translateX(-50%);
  padding:8px 15px;border-radius:999px;background:#fffdf8;color:#7c5237;
  font-size:var(--fs-sm);line-height:1;white-space:nowrap;
  border:1px solid rgba(196,134,91,.32);box-shadow:0 10px 26px rgba(84,54,31,.12);
  animation:catBubble 4.8s ease-in-out infinite;
}
.cat-panel.is-away .cat-bubble{color:#9a4f29;background:#fff7ed;border-color:rgba(196,104,60,.42)}
.cat-bubble:after{
  content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;
  border-right:1px solid rgba(196,134,91,.32);border-bottom:1px solid rgba(196,134,91,.32);
  transform:translateX(-50%) rotate(45deg);
}
@keyframes catBubble{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.cat-caption{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:10px;color:#a08a76;font-size:9.5px;letter-spacing:.22em;
}
.cat-caption:before,.cat-caption:after{content:"";width:26px;height:1px;background:rgba(160,138,118,.35)}
.cat-caption span{white-space:nowrap}

/* ---------- 演示登录卡 ---------- */
.login-card{
  position:relative;flex:0 0 400px;width:400px;max-width:100%;
  background:var(--card);border:1px solid rgba(120,86,58,.17);border-radius:26px;
  padding:34px 34px 26px;
  box-shadow:0 38px 80px -34px rgba(84,52,28,.42),0 10px 26px rgba(84,52,28,.08);
}
.login-card:before{
  content:"";position:absolute;top:-1px;right:30px;width:68px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,rgba(207,107,63,0),var(--accent));
}
.card-head{display:flex;align-items:flex-start;gap:15px;margin-bottom:26px}
.card-mark{
  width:46px;height:46px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:#ffe8ce;box-shadow:0 8px 18px rgba(44,33,24,.18);
}
.card-mark svg{width:24px;height:24px}
.card-head>div{min-width:0}
.eyebrow{font-size:9.5px;letter-spacing:.24em;color:var(--accent);font-weight:600;margin-bottom:7px}
.login-card h1{
  margin:0 0 5px;font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.16;
  letter-spacing:-.015em;color:var(--ink);overflow-wrap:anywhere;
}
.login-card .sub{margin:0;color:var(--muted);font-size:var(--fs-sm);line-height:1.55;overflow-wrap:anywhere}
.field{display:block;margin-bottom:13px}
.field-label{display:block;margin-bottom:6px;color:var(--ink-2);font-size:var(--fs-xs);letter-spacing:.06em}
.field-box{
  display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;
  background:var(--field);border:1px solid transparent;border-radius:14px;
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.field-box:focus-within{background:#fff;border-color:rgba(207,107,63,.55);box-shadow:0 0 0 4px rgba(207,107,63,.11)}
.field-box svg.lead{width:17px;height:17px;flex:none;color:#9a7258}
.field-box input{width:100%;min-width:0;height:100%;padding:0;border:0;outline:none;background:transparent;font-size:var(--fs-base)}
.field-box input::placeholder{color:#b3a291}
.pass-box{padding-right:7px}
.eye{
  width:36px;height:36px;flex:none;border:0;border-radius:50%;background:transparent;color:#8f7562;
  display:flex;align-items:center;justify-content:center;
}
.eye:hover{background:#f3e6d7;color:var(--accent)}
.eye svg{width:18px;height:18px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 4px}
.remember{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:var(--fs-xs);cursor:pointer;user-select:none}
.remember input{width:14px;height:14px;margin:0;accent-color:var(--accent);cursor:pointer}
.fill-demo{
  border:0;background:transparent;padding:2px 0;color:var(--accent);font-size:var(--fs-xs);
  border-bottom:1px solid rgba(207,107,63,.35);
}
.fill-demo:hover{color:var(--accent-dark);border-bottom-color:var(--accent-dark)}
.form-error{color:#b34a30;min-height:19px;font-size:var(--fs-xs);line-height:1.5;margin:2px 0 6px;overflow-wrap:anywhere}
.submit{
  width:100%;height:50px;border:0;border-radius:999px;background:var(--accent);color:#fffaf3;
  display:flex;align-items:center;justify-content:center;gap:9px;font-size:14.5px;font-weight:600;
  letter-spacing:.06em;box-shadow:0 14px 26px -12px rgba(207,107,63,.65);
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
}
.submit:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 18px 30px -12px rgba(180,84,44,.6)}
.submit:active{transform:translateY(0)}
.submit:disabled{opacity:.72;cursor:default;transform:none}
.submit svg{width:16px;height:16px}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:15px;
  border-top:1px solid rgba(120,86,58,.12);color:#a08a76;font-size:10.5px;line-height:1.5;
}
.card-foot b{font-weight:600;color:#7c624f;letter-spacing:.03em}
.card-foot span{text-align:right}
@media (prefers-reduced-motion:reduce){
  .cat-bubble{animation:none}
  .cat-fallback{transition:none}
  .submit{transition:none}
}
@media (max-width:860px){
  .login-page{padding:30px 20px 24px}
  .login-stage{flex-direction:column;gap:8px;max-width:400px}
  .cat-panel{flex:none;width:238px;margin-bottom:-10px}
  .cat-halo{width:242px;height:242px}
  .cat-bubble{top:0;font-size:var(--fs-xs);padding:7px 12px}
  .cat-caption{margin-top:4px;font-size:8.5px}
  .login-card{flex:none;width:100%;max-width:calc(100vw - 40px);padding:29px 26px 24px}
  .login-card h1{font-size:26px}
}
@media (max-width:420px){
  .login-page{padding:20px 14px 18px}
  .cat-panel{width:196px}
  .cat-halo{width:200px;height:200px}
  .cat-bubble{font-size:10.5px;padding:6px 10px;top:-2px}
  .login-card{padding:25px 20px 21px;border-radius:22px}
  .login-card h1{font-size:24px}
  .card-head{gap:12px;margin-bottom:21px}
  .card-mark{width:40px;height:40px}
  .card-mark svg{width:21px;height:21px}
}
</style>
</head>
<body>
<div class="login-page">
  <main class="login-stage">
    <div class="cat-panel" id="loginCat" aria-hidden="true">
      <div class="cat-halo"></div>
      <div class="cat-bubble" id="catBubble">喵，欢迎回来</div>
      <div class="cat-stage" id="catStage">
        <img class="cat-fallback" id="catFallback" src="assets/catseq20-fallback.webp" width="512" height="512" alt="" draggable="false">
        <canvas class="cat-canvas" id="catCanvas" width="512" height="512" role="img" aria-label="一只会看方向的橘猫"></canvas>
      </div>
      <div class="cat-caption"><span>NEKO · ORANGE TABBY</span></div>
    </div>

    <section class="login-card">
      <div class="card-head">
        <div class="card-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="14.6" rx="5.1" ry="4.2"/>
            <circle cx="6.6" cy="9.4" r="2.1"/><circle cx="10.2" cy="7.5" r="2.1"/>
            <circle cx="13.8" cy="7.5" r="2.1"/><circle cx="17.4" cy="9.4" r="2.1"/>
          </svg>
        </div>
        <div>
          <div class="eyebrow">MEOW · WORKSPACE</div>
          <h1>欢迎回来</h1>
          <p class="sub">登录 Cat Space，继续今天的工作。</p>
        </div>
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <label class="field" for="loginUser">
          <span class="field-label">账号</span>
          <span class="field-box">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="7.6" r="3.7"/><path d="M4.8 20c.6-4 3.3-6 7.2-6s6.6 2 7.2 6"/>
            </svg>
            <input id="loginUser" type="text" placeholder="输入演示账号" autocomplete="username" required>
          </span>
        </label>

        <label class="field" for="loginPass">
          <span class="field-label">密码</span>
          <span class="field-box pass-box">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
            </svg>
            <input id="loginPass" type="password" placeholder="输入演示密码" autocomplete="current-password" required>
            <button class="eye" id="togglePass" type="button" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path id="eyeOpen" d="M2.5 12s3.4-5.2 9.5-5.2S21.5 12 21.5 12 18.1 17.2 12 17.2 2.5 12 2.5 12Z"/>
                <circle id="eyeDot" cx="12" cy="12" r="2.5"/>
                <path id="eyeSlash" d="M4 4l16 16" style="display:none"/>
              </svg>
            </button>
          </span>
        </label>

        <div class="row-between">
          <label class="remember"><input id="remember" type="checkbox">记住我</label>
          <button class="fill-demo" id="fillDemo" type="button">填入演示账号</button>
        </div>
        <div class="form-error" id="loginError" role="alert"></div>
        <button class="submit" id="loginBtn" type="submit">
          <span>进入工作台</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>

      <div class="card-foot">
        <span><b>DEMO</b> · 纯前端演示</span>
        <span>不会发送任何数据</span>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const CAT_COLS = 5;
  const CAT_ROWS = 4;
  const CAT_CELL = 768;
  const FRAME_MS = 55;
  const SEQ = {
    center: [0],
    right: [1, 2, 3, 4],
    left: [5, 6, 7],
    up: [8, 9, 10, 11],
    down: [12, 13, 14],
    away: [15, 16, 17, 18, 19]
  };

  const canvas = $('#catCanvas');
  const ctx = canvas.getContext('2d');
  const cat = $('#loginCat');
  const bubble = $('#catBubble');
  const account = $('#loginUser');
  const password = $('#loginPass');
  const form = $('#loginForm');
  const error = $('#loginError');
  const loginBtn = $('#loginBtn');
  const toggle = $('#togglePass');
  const fillDemo = $('#fillDemo');
  const eyeOpen = $('#eyeOpen');
  const eyeDot = $('#eyeDot');
  const eyeSlash = $('#eyeSlash');
  const btnHTML = loginBtn.innerHTML;

  let sprite = null;
  let ready = false;
  let frame = 0;
  let look = 'center';
  let timer = null;
  let away = false;
  let awayTimer = 0;

  function fit() {
    const css = canvas.clientWidth || 352;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  function draw() {
    if (!ready || !sprite) return;
    const w = canvas.clientWidth || 352;
    const h = canvas.clientHeight || w;
    ctx.clearRect(0, 0, w, h);
    const idx = frame % (CAT_COLS * CAT_ROWS);
    const col = idx % CAT_COLS;
    const row = Math.floor(idx / CAT_COLS);
    ctx.drawImage(sprite, col * CAT_CELL, row * CAT_CELL, CAT_CELL, CAT_CELL, 0, 0, w, h);
  }

  function stopSeq() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function setBubble(text, isAway) {
    bubble.textContent = text;
    cat.classList.toggle('is-away', !!isAway);
  }

  function setLook(name) {
    if (look === name) return;
    look = name;
    stopSeq();
    const list = SEQ[name] || SEQ.center;
    frame = list[0];
    draw();
    setBubble(name === 'away' ? '我不看' : '喵，欢迎回来', name === 'away');
    if (list.length < 2) return;
    let pos = 0;
    timer = setInterval(() => {
      pos += 1;
      if (pos >= list.length) { stopSeq(); return; }
      frame = list[pos];
      draw();
    }, FRAME_MS);
  }

  function idle() {
    away = false;
    clearTimeout(awayTimer);
    stopSeq();
    look = 'center';
    frame = 0;
    draw();
    setBubble('喵，欢迎回来', false);
  }

  function lookAway() {
    if (away) return;
    away = true;
    setLook('left');
    clearTimeout(awayTimer);
    awayTimer = setTimeout(() => { if (away) setLook('away'); }, 130);
  }

  function gazeAt(x, y) {
    if (away) return;
    const active = document.activeElement;
    if (active === account || active === password) return;
    const r = cat.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const nx = Math.max(-1, Math.min(1, (x - r.left - r.width / 2) / (r.width / 2)));
    const ny = Math.max(-1, Math.min(1, (y - r.top - r.height * .42) / (r.height / 2)));
    const ax = Math.abs(nx), ay = Math.abs(ny);
    if (Math.max(ax, ay) < .10) { setLook('center'); return; }
    if (ax > ay * 1.08) setLook(nx < 0 ? 'left' : 'right');
    else if (ay > ax * 1.08) setLook(ny < 0 ? 'up' : 'down');
    else setLook('center');
  }

  const img = new Image();
  img.decoding = 'async';
  img.onload = () => {
    sprite = img;
    ready = true;
    fit();
    draw();
    $('#catFallback').style.opacity = '0';
  };
  img.src = 'assets/catseq20-sprite-fix.webp';

  fit();
  window.addEventListener('resize', () => { fit(); draw(); });
  window.addEventListener('pointermove', e => gazeAt(e.clientX, e.clientY), { passive: true });

  account.addEventListener('focus', () => { if (!away) setLook('right'); });
  account.addEventListener('blur', () => { if (!away) idle(); });

  password.addEventListener('focus', lookAway);
  password.addEventListener('input', lookAway);
  password.addEventListener('blur', idle);

  window.addEventListener('blur', () => { if (!away) idle(); });

  toggle.addEventListener('mousedown', e => e.preventDefault());
  toggle.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    eyeOpen.style.display = show ? 'none' : '';
    eyeDot.style.display = show ? 'none' : '';
    eyeSlash.style.display = show ? '' : 'none';
    if (document.activeElement !== password) password.focus();
    if (show) lookAway();
  });

  fillDemo.addEventListener('click', () => {
    account.value = 'demo';
    password.value = 'meow123';
    error.textContent = '';
    account.focus();
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    error.textContent = '';
    if (!account.value.trim() || !password.value.trim()) {
      error.textContent = '请先输入账号和密码，或点“填入演示账号”。';
      return;
    }
    if (account.value.trim() === 'demo' && password.value === 'meow123') {
      loginBtn.disabled = true;
      loginBtn.textContent = '登录成功，正在进入…';
      setTimeout(() => {
        loginBtn.disabled = false;
        loginBtn.innerHTML = btnHTML;
      }, 1600);
      return;
    }
    error.textContent = '演示模式：请使用 demo / meow123，或点“填入演示账号”。';
  });
  form.addEventListener('input', () => { error.textContent = ''; });

  window.__catVersion = 'single-20f-demo-card';
})();
</script>
</body>
</html>
